name: Mathlib

# Lean Studio against a real Mathlib project, weekly and on demand: Prove It with Mathlib's tactics, counterexamples,
# the profiler, and Tenet reading Mathlib's compiled library. Too heavy (a Mathlib cache is several GB) for every push.
# Also a deep fuzz run: the fuzz tests with 20,000 seeds instead of every push's 2,000.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  mathlib:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install elan and Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Make a Mathlib project (fetches Mathlib's cache)
        run: |
          cd "$RUNNER_TEMP"
          lake new MathDemo math
          cd MathDemo && lake build
          echo "LEANSTUDIO_MATHLIB_PROJECT=$RUNNER_TEMP/MathDemo" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build tests/LeanStudio.Tests -c Release
      - name: Mathlib tests
        run: dotnet test --project tests/LeanStudio.Tests -c Release --no-build -- --filter-class LeanStudio.Tests.MathlibTests
      - name: Deep fuzz (20,000 random inputs per parser and editing engine)
        env:
          LEANSTUDIO_FUZZ_SEEDS: "20000"
        run: dotnet test --project tests/LeanStudio.Tests -c Release --no-build -- --filter-class LeanStudio.Tests.FuzzTests
