name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.34.0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install elan and Lean (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$LEAN_TOOLCHAIN"
      - name: Install elan and Lean (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -OutFile elan-init.ps1
          ./elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.elan\bin\elan.exe" toolchain install $env:LEAN_TOOLCHAIN

      - name: Build
        run: dotnet build LeanStudio.slnx -c Release
      - name: Unit and Lean integration tests
        run: dotnet test --project tests/LeanStudio.Tests -c Release --no-build

      - name: Drive the UI against a real Lean server
        if: runner.os != 'Windows'
        run: dotnet tools/LeanStudio.Snapshot/bin/Release/net10.0/LeanStudio.Snapshot.dll . snapshots
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: snapshots-${{ runner.os }}
          path: snapshots/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.rid }})
    needs: test
    # Tags publish a release. Running the workflow by hand builds the packages too (without releasing them),
    # to try packaging changes before tagging.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Signing and notarization are optional: each runs only when its secrets are set (docs/packaging/signing.md),
      # so the build works without them. Secrets are given only to the steps that use them.
      - name: Check for signing credentials
        id: signing
        shell: bash
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          MACOS_NOTARY: ${{ secrets.APPLE_API_KEY != '' || secrets.APPLE_ID != '' }}
          WINDOWS_PFX: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          WINDOWS_AZURE: ${{ secrets.AZURE_CLIENT_SECRET != '' && secrets.ARTIFACT_SIGNING_ENDPOINT != '' }}
        run: |
          macos=false; notarize=false; windows=none
          if [ "$RUNNER_OS" = macOS ] && [ "$MACOS_CERT" = true ]; then
            macos=true
            [ "$MACOS_NOTARY" = true ] && notarize=true
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            if [ "$WINDOWS_PFX" = true ]; then windows=pfx; elif [ "$WINDOWS_AZURE" = true ]; then windows=azure; fi
          fi
          { echo "macos=$macos"; echo "notarize=$notarize"; echo "windows=$windows"; } >> "$GITHUB_OUTPUT"
          echo "macOS signing: $macos, notarization: $notarize, Windows signing: $windows"
      - name: Import the Developer ID certificate
        if: steps.signing.outputs.macos == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: packaging/macos/import-certificate.sh

      - name: Build
        shell: bash
        run: packaging/publish.sh ${{ matrix.rid }} build

      - name: Notarize (macOS)
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/notarize.sh ${{ matrix.rid }}
      - name: Sign with a certificate (Windows)
        if: steps.signing.outputs.windows == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: packaging/windows/sign.ps1 -Rid ${{ matrix.rid }}
      - name: List the files to sign (Windows)
        if: steps.signing.outputs.windows == 'azure'
        id: files
        shell: pwsh
        run: |
          $files = packaging/windows/sign.ps1 -Rid ${{ matrix.rid }} -ListOnly
          "files<<EOF`n$($files -join "`n")`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Sign with Azure Artifact Signing (Windows)
        if: steps.signing.outputs.windows == 'azure'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.files.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Lean Studio
          description-url: https://github.com/keithadler/leanstudio

      - name: Archive
        shell: bash
        run: packaging/publish.sh ${{ matrix.rid }} archive
      - name: AppImage
        if: startsWith(matrix.rid, 'linux-')
        run: packaging/linux/build-appimage.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: leanstudio-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.AppImage
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.macos == 'true'
        run: security delete-keychain "$MACOS_KEYCHAIN" || true

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: leanstudio-*   # the builds only, not the UI run's screenshots
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Lean Studio ${GITHUB_REF_NAME#v}" --generate-notes
