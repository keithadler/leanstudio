ShortDescription: A desktop IDE for the Lean 4 theorem prover.
Description: |-
  Lean Studio is a native desktop IDE built only for Lean 4. It shows the tactic state with Lean's own diff of
  each step, lists every tactic in a proof with what it changed, and re-checks each declaration you build with
  Tenet, an independent implementation of Lean's kernel. It includes a tutorial for newcomers, Prove It (a
  portfolio of tactics tried on each sorry), a Mathlib search in plain English, Git and GitHub, and an MCP
  server so AI assistants can use Lean while they work. Lean itself is installed through elan, which Lean
  Studio offers to set up.
